# The full stack on your own machine: built from this checkout, using your serving_bundle/
# and .env (GROQ_API_KEY, SERVING_API_KEY, DASHBOARD_PASSWORD, ...). One command:
#
#   docker compose -f compose.local.yaml up --build        # Ctrl+C stops it
#   docker compose -f compose.local.yaml down              # remove the containers
#
# Chat http://localhost:8501, dashboard http://localhost:8502, API http://localhost:8000.
# The API image copies models/ (run python scripts/app/fetch_models.py once if it is missing).
# compose.ci.yaml is the keyless variant (synthetic bundle, mock LLM) that CI uses.
name: bugzilla-local

services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: bugzilla-api:local
    env_file: .env
    environment:
      BUNDLE_DIR: /bundle
    volumes:
      - ./serving_bundle:/bundle:ro
      - appdata:/app/outputs
    ports:
      - "8000:8000"

  chat:
    build: { context: ., dockerfile: docker/chat.Dockerfile }
    image: bugzilla-chat:local
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8501:8501"

  dashboard:
    build: { context: ., dockerfile: docker/dashboard.Dockerfile, target: dashboard-readonly }
    image: bugzilla-dashboard:local
    env_file: .env
    environment:
      DASHBOARD_LAB_ENABLED: "false"
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8502:8502"

volumes:
  appdata:
