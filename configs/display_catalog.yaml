systems:
  S0: {name: "Closed-book", short: "Answers from model memory only — no bug data", long: "Baseline. The model gets the question but none of the Bugzilla records, so it should decline anything it can't know."}
  S1: {name: "Keyword search", short: "Finds bug text by exact keywords, then answers", long: "Classic keyword search (BM25) over the bug text; the top passages are given to the model."}
  S2: {name: "Smart search", short: "Rewrites the question several ways, searches with each, then answers", long: "Multi-query search: the model writes a few rephrasings, each is searched (keyword + meaning), results are merged and given to the model. Selected on dev data before testing."}
  S3: {name: "Query rewriting", short: "Same pipeline as Smart search in this study", long: "Planned as a separate query-rewriting system; in this study it uses exactly the Smart search pipeline, so its results are reused rather than re-run."}
  S4: {name: "Self-checking search", short: "Searches, checks the evidence, searches again if weak", long: "Corrective retrieval: after searching, the system judges whether the evidence is good enough and retries with a better query if not."}
  S5: {name: "Full bug dossier", short: "Loads a large file of the bug's records into the prompt", long: "Long-context approach: instead of short passages, the model reads a compact dossier of everything recorded about the bug, up to a token budget."}
  S6: {name: "Linked-bugs search", short: "Also pulls in bugs linked to the ones found", long: "Graph expansion: after searching, it adds bugs connected through blocks / depends-on / duplicate links."}
  S7: {name: "Database tools", short: "Answers with exact database lookups", long: "The model calls structured tools (field lookups, counts, relations) on the bug database. Precise, but the tools need a bug ID."}
  S8: {name: "Auto-router", short: "Picks a strategy per question type", long: "Rule-based router: detects the kind of question and sends it to the system that suits it (e.g. tools for counts, dossier for timelines)."}
  S7v2: {name: "Database tools v2", short: "Cohort-aware linked bugs and public comment lookup"}
  S8v2: {name: "Auto-router v2", short: "Routes multi-step questions to v2 tools and pins cited comments"}
  ORACLE: {name: "Oracle (diagnostic only)", short: "Upper bound using the gold evidence — not a real system", long: "Diagnostic only; never shown in leaderboards."}
  R0: {name: "Search-only fallback", short: "Shows matching bugs without an AI answer", long: "Used when the free LLM quota is exhausted: returns the best-matching bug passages, no generated answer."}
retrievers:
  R1: {name: "Keyword (BM25)", short: "Exact word matching"}
  R2: {name: "Semantic", short: "Matches by meaning using sentence embeddings (MiniLM)"}
  R3: {name: "Hybrid", short: "Keyword + semantic results fused"}
  R4: {name: "Hierarchical", short: "Finds the bug first, then the passages inside it"}
  R5: {name: "Reranked", short: "A second model re-scores the top results"}
  R6: {name: "Graph expansion", short: "Adds linked bugs to the results"}
  R7a: {name: "HyDE", short: "Searches with a model-written hypothetical answer"}
  R7b: {name: "Multi-query", short: "Searches with several rewrites of the question and merges"}
corpora:
  C0: {name: "Original passages", short: "Bug text as first chunked (long text truncated)"}
  C1: {name: "Full-text passages", short: "Re-chunked so nothing is truncated"}
  C2: {name: "Passages with bug header", short: "Each passage prefixed with the bug's ID and title"}
families:
  F1:  {name: "Field lookup", short: "A recorded field of a given bug", example: "What component is recorded for Firefox bug 1770351?"}
  F2:  {name: "Lifecycle & timing", short: "Time to fix, reopen counts — from change history", example: "How many calendar hours elapsed before bug 1794818 first reached FIXED?"}
  F3:  {name: "Counting", short: "How many bugs match a condition", example: "How many dev-partition bugs have component Search?"}
  F4:  {name: "Bug relationships", short: "Blocks / depends-on / duplicate links", example: "Which bugs does bug 1854980 depend on?"}
  F5:  {name: "Reasons (LLM-graded)", short: "Graded by Claude Opus 5.5 against the human-reviewed reference from the frozen benchmark", example: "What reason is stated in the cited comment for bug 1708248?"}
  F6:  {name: "Unanswerable", short: "The records can't answer it — correct is to decline", example: "How many engineer work hours did bug 1798041 require?"}
  F6H: {name: "Hard unanswerable", short: "Looks answerable but isn't — correct is to decline", example: "What exact export timestamp establishes the archived fields for bug 1707396?"}
  KI:  {name: "Find bug by description", short: "Identify a bug from a description, no ID given", example: "Which bug report describes: Pocket section in German displays English topics?"}
  MH:  {name: "Multi-step", short: "Combine facts across linked bugs", example: "Bug 1771951 depends on which bugs, and which of those are FIXED?"}
metrics:
  macro_excl_F5: {name: "Overall without Reasons", short: "Unweighted family average excluding Reasons; comparable to earlier scores."}
  score: {name: "Score", short: "Share of questions answered correctly. For Unanswerable families, correct means the system declined."}
  macro: {name: "Overall score", short: "Average of the family scores, each family counted equally (so small families matter as much as big ones)."}
  n: {name: "Questions", short: "Number of scored questions in this family."}
  abstain_rate: {name: "Declined", short: "Share of questions the system chose not to answer."}
  fail_rate: {name: "Errors", short: "Share of questions that failed (timeout or API error)."}
  llm_calls_per_question: {name: "Model calls / question", short: "How many times the LLM was called per question on average."}
  tokens_in: {name: "Tokens in", short: "Text sent to the model (prompt + evidence), in tokens (~¾ of a word)."}
  tokens_out: {name: "Tokens out", short: "Text the model generated, in tokens."}
  usage_missing_n: {name: "Calls without usage data", short: "Calls where the provider didn't report token usage; totals are then a lower bound."}
  quota_pct: {name: "Daily quota used", short: "Share of our configured free-tier daily token limit."}
  latency_p50: {name: "Typical time (s)", short: "Median time per question. Batch runs include free-tier rate-limit waits."}
  latency_p95: {name: "Slow-case time (s)", short: "95th-percentile time per question (1 in 20 questions is slower)."}
  delta: {name: "Difference", short: "Candidate minus baseline, in percentage points (pts)."}
presets:
  smart: {name: "Smart search", short: "Published Smart search configuration"}
  deep: {name: "Deep read", short: "Full bug dossier mode"}
  recommended: {name: "Recommended", short: "Best deployable accuracy"}
  fast: {name: "Fast", short: "Fewest model calls, quickest answers"}
eval_sets:
  fix-pilot-tools: {name: "Pilot tool diagnosis (21 questions)"}
  pilot122-v2: {name: "Pilot (122 eligible dev questions)"}
  fix-holdout: {name: "Fix holdout (15 counting questions)"}
  retrieval-v3-dev: {name: "Dev search benchmark"}
  synthetic-dev-10: {name: "Synthetic check (10 questions)"}
  pilot125: {name: "Pilot (125 dev questions)"}
  smoke-5: {name: "Quick check (5 questions)"}
  smoke-20: {name: "Smoke test (20 questions)"}
  "family-*": {name: "Only {family} questions"}
dataset_tags:
  synthetic: {name: "Synthetic fixture", short: "Fake records for offline checks"}
  v3: {name: "Benchmark v3", short: "Final benchmark incl. find-by-description and multi-step"}
  phase05: {name: "Phase 5 benchmark", short: "Original templated questions"}
  natural: {name: "Natural rewrites", short: "The same questions phrased the way a person would ask"}

knobs:
  s5_dossier_budget: {name: "Evidence size (bytes)", short: "Evidence size, UTF-8 bytes"}
