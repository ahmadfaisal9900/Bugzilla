[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firefox-history-qa"
version = "0.1.0"
description = "Course research project on question answering over software project history"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["duckdb==1.4.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bugzilla_qa*"]
