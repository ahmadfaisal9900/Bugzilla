# Theme tokens, modelled on kapa.ai's app: neutral greys, one blue accent, Geist.
# Layout and the few things the theme can't express live in src/bugzilla_serving/chat_ui/assets/styles.css.
[theme]
base = "light"
primaryColor = "#3853DA"            # the one accent: links, focus, primary button (5.8:1 on the pane)
backgroundColor = "#F9F9FA"         # the main pane
secondaryBackgroundColor = "#FFFFFF" # inputs and raised surfaces sit on white
textColor = "#1E1E1E"
linkColor = "#3853DA"
borderColor = "#E4E4E6"
font = "Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
headingFont = "Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
baseFontSize = 14
baseRadius = "8px"
showSidebarBorder = false

# Geist (SIL Open Font License), self-hosted so the app works offline and in Docker.
[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/Geist-Variable-latin.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/Geist-Variable-latin.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/Geist-Variable-latin.woff2"
weight = 600
style = "normal"

[theme.sidebar]
backgroundColor = "#F1F1F2"         # the app frame around the pane
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E1E1E"
borderColor = "#E4E4E6"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false
